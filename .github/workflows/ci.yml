name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-ubuntu:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld-22
          echo "LLVM_SYS_220_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run --workspace

  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 22
        run: |
          brew install llvm@22
          echo "LLVM_SYS_220_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run --workspace

  test-windows:
    name: Test (windows-latest, runtime)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Build runtime
        run: cargo build -p glyim-runtime
      - name: Run runtime tests (verifies Windows process signaling, Phase 6.4)
        run: cargo nextest run -p glyim-runtime
