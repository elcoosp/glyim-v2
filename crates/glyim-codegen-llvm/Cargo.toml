[package]
name = "glyim-codegen-llvm"
edition.workspace = true
version.workspace = true

[dependencies]
inkwell = { workspace = true, features = ["llvm22-1"] }
# Raw FFI bindings for the LLVM-C funclet (exception-handling) API, which the
# pinned inkwell 0.10 does not wrap. Version must match the llvm-sys instance
# inkwell links (221.0.1) so the raw pointers resolve against the same libLLVM.
llvm-sys = "221"
glyim-codegen = { workspace = true }
glyim-mir = { workspace = true }
glyim-diag = { workspace = true }
glyim-core = { workspace = true }
glyim-type = { workspace = true }
glyim-layout = { workspace = true }
glyim-span = { workspace = true }
glyim-db = { workspace = true }
tracing = { workspace = true }
[dev-dependencies]
tempfile = "3"
glyim-core = { workspace = true }
glyim-test = { workspace = true }
